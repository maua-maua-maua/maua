[tool.uv]
# Acknowledges preview APIs (e.g. extra-build-dependencies) so uv does not warn on every install.
preview = true
# basicsr / gfpgan declare tb-nightly; that wheel provides the same top-level `tensorboard` module
# as stable `tensorboard`, which triggers uv's duplicate-module warning. Training code only needs
# the TensorBoard API; mirror upstream requirements but swap tb-nightly → tensorboard (BasicSR 1.4.2).
dependency-metadata = [
    { name = "basicsr", version = "1.4.2", requires-dist = [
        "addict",
        "future",
        "lmdb",
        "numpy>=1.17",
        "opencv-python",
        "pillow",
        "pyyaml",
        "requests",
        "scikit-image",
        "scipy",
        "tensorboard>=2.11",
        "torch>=1.7",
        "torchvision",
        "tqdm",
        "yapf",
    ] },
    { name = "gfpgan", version = "1.3.8", requires-dist = [
        "basicsr>=1.4.2",
        "facexlib>=0.2.5",
        "lmdb",
        "numpy",
        "opencv-python",
        "pyyaml",
        "scipy",
        "tensorboard>=2.11",
        "torch>=1.7",
        "torchvision",
        "tqdm",
        "yapf",
    ] },
]

[tool.uv.pip]
# glumpy 1.2.1 uses setuptools fetch_build_eggs(), which runs `python -m pip` inside the
# build environment; uv's isolated builders do not ship pip, so the build fails otherwise.
no-build-isolation-package = ["glumpy"]
# mmcv-full 1.7.2 setup imports pkg_resources; setuptools 82+ removed pkg_resources, so the
# build needs an older setuptools in the isolated env (see pypa/setuptools#5007).
# youtokentome: setup imports Cython without declaring it as a build dependency.
extra-build-dependencies = { "mmcv-full" = ["setuptools<82"], "youtokentome" = ["cython"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast tier (CPU) runs by default. Other lanes:
#   pytest -m gpu                     full smoke tier (needs a CUDA GPU; pin CUDA_VISIBLE_DEVICES)
#   pytest -m "gpu and not slow"      quick smoke lane, skips multi-minute/large-download tests
#   pytest -m "gpu and not download"  smoke without first-run weight fetches
addopts = "-m 'not gpu'"
# Safety ceiling so a hung kernel/download can't wedge a run forever; real tests finish well under this.
timeout = 1200
markers = [
    "gpu: needs a CUDA GPU (smoke tier)",
    "slow: takes a long time even at tiny settings",
    "download: downloads model weights on first run",
    "backend_stable: stable diffusion backend",
    "backend_guided: guided (Disco) diffusion backend",
    "backend_latent: latent diffusion backend",
    "backend_glide: GLIDE backend",
    "backend_glid3xl: GLID-3-XL backend",
]

[tool.ruff]
line-length = 120
preview = true

# Third-party git submodules (see .gitmodules); do not lint or format them.
extend-exclude = [
    "maua/submodules",
    "maua/audio",
    "maua/GAN/studio",
    "maua/GAN/nv",
    "maua/GAN/pix2pix",
]

[tool.ruff.lint]
extend-select = ["TID252", "F821"]
extend-ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# torchtyping TensorType["dim"] string annotations look like undefined names to pyflakes
"maua/audiovisual/audioreactive/latent.py" = ["F821"]

[tool.ruff.lint.flake8-tidy-imports]
# Prefer `from maua...` over `from .` / `from ..` (PEP 8: absolute imports).
ban-relative-imports = "all"